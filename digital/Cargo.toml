[workspace]
resolver = "2"
members = ["seks/engine", "seks/bots", "seks/wasm", "liu/engine", "liu/bots", "liu/wasm", "sia/engine", "sia/bots", "sia/wasm", "shesh/engine", "shesh/bots"]

[workspace.package]
edition = "2021"

[profile.release]
opt-level = 3
lto = true

# The bot tests play hundreds of games: unoptimized code makes them 10x slower.
[profile.dev.package.seks-engine]
opt-level = 2

[profile.dev.package.seks-bots]
opt-level = 2

[profile.dev.package.liu-engine]
opt-level = 2

[profile.dev.package.liu-bots]
opt-level = 2

[profile.dev.package.sia-engine]
opt-level = 2

[profile.dev.package.sia-bots]
opt-level = 2

[profile.dev.package.shesh-engine]
opt-level = 2

[profile.dev.package.shesh-bots]
opt-level = 2
