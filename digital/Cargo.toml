[workspace]
resolver = "2"
members = ["seks/engine", "seks/bots", "seks/wasm"]

[workspace.package]
edition = "2021"

[profile.release]
opt-level = 3
lto = true

# The bot tests play hundreds of games: unoptimized code makes them 10x slower.
[profile.dev.package.seks-engine]
opt-level = 2

[profile.dev.package.seks-bots]
opt-level = 2
