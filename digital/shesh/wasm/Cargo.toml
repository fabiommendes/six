[package]
name = "shesh-wasm"
version = "0.1.0"
edition.workspace = true
description = "WebAssembly bindings of the Shesh rules engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shesh-bots = { path = "../bots" }
shesh-engine = { path = "../engine", features = ["wire"] }
wasm-bindgen = "0.2"
