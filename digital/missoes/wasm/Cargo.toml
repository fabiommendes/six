[package]
name = "missoes-wasm"
version = "0.1.0"
edition.workspace = true
description = "WebAssembly bindings of the mission and dice-pool game engine and bots (prototype)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
missoes-bots = { path = "../bots" }
missoes-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"
wasm-bindgen = "0.2"
