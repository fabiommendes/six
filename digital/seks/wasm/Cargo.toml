[package]
name = "seks-wasm"
version = "0.1.0"
edition.workspace = true
description = "WebAssembly bindings of the Seks rules engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seks-bots = { path = "../bots" }
seks-engine = { path = "../engine", features = ["wire"] }
wasm-bindgen = "0.2"
