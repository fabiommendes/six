[project]
name = "seks-train-scripts"
version = "0.1.0"
description = "Grids of training experiments of the Seks bots, with a short summary per experiment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seks-experiments = "experiments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["experiments.py"]
